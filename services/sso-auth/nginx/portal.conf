# Пример конфига nginx для единого портала.
# Портал и auth-сервис слушают только 127.0.0.1:8080 — наружу торчит
# только этот server-блок nginx.
#
# ВАЖНО (миграция по одной панели, как договорились):
#   - блок /monitor/ ниже уже настроен на новую SSO-схему (доверенный
#     заголовок X-Remote-User) — это первая переводимая панель.
#   - остальные 4 блока (/conf/, /provision/, /alert/, /cdr/) оставлены
#     закомментированными как заготовка "проксируем, но панель пока
#     использует свой старый логин" — раскомментировать и включить
#     auth_request по мере миграции каждой из них.
#   - у каждой мигрируемой панели HOST в config.py должен быть изменён
#     с 0.0.0.0 на 127.0.0.1 — иначе SSO можно обойти, обратившись
#     напрямую на порт панели в обход nginx.

server {
    listen 80;
    server_name _;

    # --- сам портал / логин / управление пользователями ---
    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8080/static/;
    }

    # --- служебная локация, наружу не отдаётся (только nginx её дёргает) ---
    location = /_verify {
        internal;
        proxy_pass http://127.0.0.1:8080/_verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Монитор АТС (порт 8093) — первая мигрированная панель ---
    location /monitor/ {
        auth_request /_verify;
        auth_request_set $remote_user $upstream_http_x_remote_user;
        auth_request_set $remote_role $upstream_http_x_remote_role;
        error_page 401 = @auth_redirect;

        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Remote-Role $remote_role;
        proxy_set_header Host $host;

        # приложение ожидает работать без префикса пути — снимаем /monitor
        rewrite ^/monitor/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8093;
    }

    location @auth_redirect {
        return 302 /login?next=$request_uri;
    }

    # --- остальные панели: пока НЕ переведены на SSO, просто проксируются ---
    # с их собственным логином. Раскомментировать и добавить auth_request
    # по мере миграции (см. README.md — план по одной панели за раз).
    #
    # location /conf/ {
    #     rewrite ^/conf/?(.*)$ /$1 break;
    #     proxy_pass http://127.0.0.1:5000;
    #     proxy_set_header Host $host;
    # }
    # location /provision/ {
    #     rewrite ^/provision/?(.*)$ /$1 break;
    #     proxy_pass http://127.0.0.1:8090;
    #     proxy_set_header Host $host;
    # }
    # location /alert/ {
    #     rewrite ^/alert/?(.*)$ /$1 break;
    #     proxy_pass http://127.0.0.1:8091;
    #     proxy_set_header Host $host;
    # }
    # location /cdr/ {
    #     rewrite ^/cdr/?(.*)$ /$1 break;
    #     proxy_pass http://127.0.0.1:8092;
    #     proxy_set_header Host $host;
    # }
}
